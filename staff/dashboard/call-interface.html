<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Call — Voddic Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c18;--card:#151528;--gold:#e4af3e;--danger:#e2412c;--success:#2fa06a;--text:#eaeaf0;--text-dim:#8a8aa8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
.call-container{width:100%;max-width:420px;padding:20px;text-align:center;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
.call-status{font-size:1.4rem;font-weight:700;margin-bottom:8px}
.call-status.ringing{color:var(--gold);animation:pulse 1s infinite}
.call-status.connected{color:var(--success)}
.call-status.ended{color:var(--danger)}
.call-timer{font-family:monospace;font-size:4rem;font-weight:800;color:var(--text);margin:16px 0}
.call-info{color:var(--text-dim);font-size:.9rem;margin-bottom:8px}
.call-info .room{font-weight:700;color:var(--gold)}
.call-info .dept{color:var(--text)}
.call-actions{display:flex;gap:20px;margin-top:30px}
.call-btn{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;transition:all .2s;border:none;cursor:pointer}
.call-btn:active{transform:scale(.92)}
.call-btn.end{background:var(--danger);color:#fff}
.call-btn.end:hover{background:#c0392b}
.call-btn.answer{background:var(--success);color:#fff}
.call-btn.answer:hover{background:#27ae60}
.call-btn.decline{background:#444;color:#fff}
.call-log{margin-top:20px;width:100%;max-height:120px;overflow-y:auto;font-size:.8rem;color:var(--text-dim);text-align:center}
.call-log p{margin:4px 0;padding:6px;background:rgba(255,255,255,.03);border-radius:6px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:6px}
.toast{padding:10px 16px;border-radius:6px;font-size:.72rem;font-weight:600;color:#f0f0f8;background:#1e1e38;border:1px solid rgba(255,255,255,.08);animation:slideIn .3s ease;max-width:260px}
.toast.success{border-left:3px solid #34d399}.toast.info{border-left:3px solid #60a5fa}.toast.error{border-left:3px solid #e54545}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.back-btn{position:fixed;top:16px;left:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:var(--text);padding:10px 16px;border-radius:8px;font-size:.8rem;cursor:pointer;display:flex;align-items:center;gap:8px;z-index:10}
.back-btn:hover{background:rgba(255,255,255,.12)}
</style>
</head>
<body>

<button class="back-btn" onclick="goBack()">← Back</button>

<div class="call-container">
    <div class="call-status ringing" id="callStatus">📞 Ringing...</div>
    <div class="call-timer" id="callTimer">00:00</div>
    <div class="call-info">
        <div>Room <span class="room" id="callerRoom">---</span></div>
        <div style="font-size:.8rem;margin-top:4px;">Department: <span class="dept" id="callerDept">Reception</span></div>
        <div style="font-size:.7rem;margin-top:2px;color:var(--text-dim);" id="callerName">Guest</div>
    </div>
    <div class="call-actions" id="callActions">
        <button class="call-btn answer" id="answerBtn" onclick="answerCall()">✅</button>
        <button class="call-btn decline" id="declineBtn" onclick="declineCall()">❌</button>
    </div>
    <div class="call-log" id="callLog"></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const API = "https://connectapi.voddic.com.ng/api/v1";
const token = localStorage.getItem("access_token");
const user = JSON.parse(localStorage.getItem("user") || "{}");

if (!token) {
    window.location.href = "/auth/login.html";
}

// Get call data from URL
const params = new URLSearchParams(window.location.search);
const callId = params.get("call_id");
const roomNumber = params.get("room") || "---";
const department = params.get("dept") || "Reception";
const callerName = params.get("caller") || "Guest";

let callStartTime = null;
let callTimerInterval = null;
let callStatus = 'ringing'; // ringing, connected, ended

console.log("📞 Call Interface loaded:", { callId, roomNumber, department, callerName });

document.addEventListener("DOMContentLoaded", function() {
    document.getElementById("callerRoom").textContent = roomNumber;
    document.getElementById("callerDept").textContent = department;
    document.getElementById("callerName").textContent = callerName;
    
    // If callId is provided, check status automatically
    if (callId) {
        checkCallStatus();
        // Start polling
        setInterval(checkCallStatus, 3000);
    }
});

async function checkCallStatus() {
    if (!callId) return;
    
    try {
        const res = await fetch(API + "/calls/status/" + callId + "/", {
            headers: { "Authorization": "Bearer " + token }
        });
        
        if (res.ok) {
            const data = await res.json();
            console.log("Call status:", data);
            
            if (data.status === 'connected' && callStatus === 'ringing') {
                setCallConnected();
            } else if (data.status === 'ended' || data.status === 'missed' || data.status === 'declined') {
                setCallEnded(data.status);
            }
        }
    } catch(e) {
        console.error("Error checking call status:", e);
    }
}

function setCallConnected() {
    callStatus = 'connected';
    document.getElementById('callStatus').textContent = '📞 Connected';
    document.getElementById('callStatus').className = 'call-status connected';
    document.getElementById('callLog').innerHTML = '<p>✅ Call connected</p>';
    
    // Start timer
    callStartTime = new Date();
    if (callTimerInterval) clearInterval(callTimerInterval);
    callTimerInterval = setInterval(updateTimer, 1000);
    
    // Show end button only
    document.getElementById('callActions').innerHTML = `
        <button class="call-btn end" onclick="endCall()">📞</button>
    `;
}

function setCallEnded(status) {
    callStatus = 'ended';
    document.getElementById('callStatus').textContent = '📞 Call ended';
    document.getElementById('callStatus').className = 'call-status ended';
    if (callTimerInterval) {
        clearInterval(callTimerInterval);
        callTimerInterval = null;
    }
    document.getElementById('callActions').innerHTML = `
        <button class="call-btn end" onclick="goBack()">← Go Back</button>
    `;
}

function updateTimer() {
    if (!callStartTime) return;
    const elapsed = Math.floor((new Date() - callStartTime) / 1000);
    const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const secs = String(elapsed % 60).padStart(2, '0');
    document.getElementById('callTimer').textContent = mins + ':' + secs;
}

async function answerCall() {
    if (!callId) {
        showToast("No call to answer", "error");
        return;
    }
    
    showToast("Answering call...", "info");
    
    try {
        const res = await fetch(API + "/calls/answer/", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                call_id: callId,
                action: 'answer'
            })
        });
        
        if (res.ok) {
            const data = await res.json();
            console.log("Call answered:", data);
            setCallConnected();
            showToast("Call answered!", "success");
            
            // Notify guest
            await fetch(API + "/calls/notify-guest/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    call_id: callId,
                    status: 'connected'
                })
            });
        } else {
            const err = await res.json();
            showToast("Failed to answer: " + (err.error || "Unknown error"), "error");
        }
    } catch(e) {
        console.error("Error answering call:", e);
        showToast("Error answering call", "error");
    }
}

async function declineCall() {
    if (!callId) {
        showToast("No call to decline", "error");
        return;
    }
    
    try {
        const res = await fetch(API + "/calls/answer/", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                call_id: callId,
                action: 'decline'
            })
        });
        
        if (res.ok) {
            showToast("Call declined", "info");
            setCallEnded('declined');
            
            await fetch(API + "/calls/notify-guest/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    call_id: callId,
                    status: 'declined'
                })
            });
            
            setTimeout(goBack, 1500);
        }
    } catch(e) {
        console.error("Error declining call:", e);
        showToast("Error declining call", "error");
    }
}

async function endCall() {
    if (!callId) return;
    
    const duration = document.getElementById('callTimer').textContent;
    
    try {
        const res = await fetch(API + "/calls/end/", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                call_id: callId,
                duration: duration
            })
        });
        
        if (res.ok) {
            showToast("Call ended", "info");
            setCallEnded('ended');
            setTimeout(goBack, 1500);
        }
    } catch(e) {
        console.error("Error ending call:", e);
        showToast("Error ending call", "error");
    }
}

function goBack() {
    window.location.href = '/staff/dashboard/call.html';
}

function showToast(msg, type) {
    const container = document.getElementById("toastContainer");
    if (!container) return;
    const toast = document.createElement("div");
    toast.className = "toast " + (type || "info");
    toast.textContent = msg;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
}

// Listen for messages from service worker
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', function(event) {
        console.log("📨 Message in call interface:", event.data);
        if (event.data && event.data.type === 'call_answered') {
            setCallConnected();
        }
    });
}
</script>
</body>
</html>
