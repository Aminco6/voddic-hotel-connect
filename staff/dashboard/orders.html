<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Orders — Voddic Staff</title>
<meta name="theme-color" content="#0f0f1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c18;--card:#151528;--gold:#e4af3e;--danger:#e2412c;--success:#2fa06a;--warning:#f59e0b;--info:#3b82f6;--text:#eaeaf0;--text-dim:#8a8aa8;--border:rgba(255,255,255,.06)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow:hidden}
a{text-decoration:none;color:inherit}
button{border:none;background:none;cursor:pointer;font-family:inherit;color:inherit}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#12121f}::-webkit-scrollbar-thumb{background:#2a2a45;border-radius:3px}

.mobile-header{display:none;position:fixed;top:0;left:0;right:0;height:56px;background:rgba(12,12,24,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);z-index:1000;align-items:center;justify-content:space-between;padding:0 16px}
.menu-toggle{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;border-radius:10px;background:rgba(255,255,255,.05)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:1100}
.sidebar-overlay.active{display:block}
.sidebar{position:fixed;top:0;left:0;width:272px;height:100vh;background:#101020;border-right:1px solid rgba(255,255,255,.06);z-index:1200;display:flex;flex-direction:column;overflow-y:auto;transition:transform .35s}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
.sidebar-logo{display:flex;align-items:center;gap:12px}.logo-icon{font-size:1.6rem}
.sidebar-logo h2{font-size:.95rem;font-weight:800;color:#f5f5fa}
.hotel-name{font-size:.72rem;color:var(--text-dim);margin-top:2px}
.sidebar-close{display:none;width:32px;height:32px;align-items:center;justify-content:center;font-size:1rem;color:var(--text-dim)}
.sidebar-nav{flex:1;padding:12px 0}
.nav-section-title{font-size:.62rem;font-weight:700;color:#55556e;letter-spacing:.08em;text-transform:uppercase;padding:14px 20px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:.82rem;font-weight:500;color:#9a9ab8;transition:all .18s;border-left:3px solid transparent;cursor:pointer}
.nav-item:hover{color:#e0e0f0;background:rgba(255,255,255,.03)}
.nav-item.active{color:#f0f0f8;background:rgba(228,175,62,.08);border-left-color:var(--gold)}
.nav-icon{font-size:.95rem;width:22px;text-align:center}
.nav-badge{margin-left:auto;font-size:.65rem;font-weight:700;background:var(--danger);color:#fff;padding:2px 7px;border-radius:10px;min-width:20px;text-align:center}
.sidebar-footer{padding:16px 18px;border-top:1px solid var(--border)}
.user-info{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.user-avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--gold),#c48a20);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;color:#000}
.user-name{font-size:.82rem;font-weight:600}.user-role{font-size:.7rem;color:var(--text-dim)}
.logout-btn{width:100%;padding:9px 14px;font-size:.78rem;font-weight:600;color:#b0b0c8;border-radius:8px;text-align:left}
.logout-btn:hover{background:rgba(229,69,69,.1);color:#e54545}

.main{margin-left:272px;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.page-header{padding:20px 24px 12px;flex-shrink:0}
.page-title{font-size:1.4rem;font-weight:800;color:#f5f5fa}
.page-subtitle{font-size:.82rem;color:var(--text-dim);margin-top:2px}

.filters{display:flex;gap:6px;padding:0 24px 14px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.filter-btn{padding:8px 16px;font-size:.78rem;font-weight:600;color:var(--text-dim);border-radius:8px;white-space:nowrap;transition:all .2s;flex-shrink:0}
.filter-btn.active{background:rgba(228,175,62,.15);color:var(--gold)}
.filter-btn:hover{color:var(--text)}

.orders-wrap{flex:1;display:flex;overflow:hidden}
.orders-list-panel{width:340px;border-right:1px solid var(--border);background:#101020;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.orders-list{flex:1;overflow-y:auto}
.order-item{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:background .15s;border-left:3px solid transparent}
.order-item:hover{background:rgba(255,255,255,.02)}
.order-item.active{background:rgba(228,175,62,.08);border-left-color:var(--gold)}
.order-item-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:6px}
.order-room{font-size:1rem;font-weight:800;color:var(--gold)}
.order-time{font-size:.65rem;color:#55556e;margin-top:2px}
.order-guest-name{font-size:.75rem;color:var(--text-dim);margin-top:2px}
.order-meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.order-total{font-size:.82rem;font-weight:700;color:var(--gold)}
.order-status{font-size:.62rem;font-weight:700;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em}
.status-PENDING{background:rgba(251,191,36,.15);color:#fbbf24}
.status-CONFIRMED{background:rgba(96,165,250,.15);color:#60a5fa}
.status-PREPARING{background:rgba(167,139,250,.15);color:#a78bfa}
.status-READY{background:rgba(52,211,153,.15);color:#34d399}
.status-DELIVERED{background:rgba(107,114,128,.15);color:#9ca3af}
.status-CANCELLED{background:rgba(239,68,68,.15);color:#f87171}

.order-detail{flex:1;display:flex;flex-direction:column;overflow:hidden}
.order-detail-head{padding:20px 24px;border-bottom:1px solid var(--border);background:#101020;flex-shrink:0}
.order-detail-body{flex:1;overflow-y:auto;padding:20px 24px}
.order-actions{padding:16px 24px;border-top:1px solid var(--border);background:#101020;display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}
.order-detail-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;color:#55556e}
.order-detail-empty .icon{font-size:3rem;margin-bottom:14px;opacity:.4}

.line-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04);gap:12px}
.line-item-info{flex:1}
.line-item-name{font-size:.88rem;font-weight:600;color:#f0f0f8}
.line-item-qty{font-size:.72rem;color:var(--text-dim);margin-top:2px}
.line-item-price{font-size:.9rem;font-weight:700;color:var(--gold)}
.notes-box{margin-top:14px;padding:12px 14px;background:rgba(228,175,62,.08);border-left:3px solid var(--gold);border-radius:6px;font-size:.82rem}

.btn{padding:10px 18px;border-radius:8px;font-size:.82rem;font-weight:700;transition:.15s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,#e4af3e,#c98e22);color:#000}
.btn-primary:hover{transform:translateY(-1px)}
.btn-success{background:rgba(52,211,153,.2);color:#34d399}
.btn-danger{background:rgba(226,65,44,.15);color:#f87171}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-dim)}

.toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:6px}
.toast{padding:10px 16px;border-radius:6px;font-size:.72rem;font-weight:600;color:#f0f0f8;background:#1e1e38;border:1px solid rgba(255,255,255,.08);animation:slideIn .3s ease;max-width:260px}
.toast.success{border-left:3px solid #34d399}.toast.info{border-left:3px solid #60a5fa}.toast.error{border-left:3px solid #e54545}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

.empty-state{text-align:center;padding:60px 20px;color:#55556e}
.empty-state .icon{font-size:3rem;margin-bottom:14px;opacity:.4}

@media(max-width:900px){
  .mobile-header{display:flex}
  .sidebar{transform:translateX(-100%);width:280px}.sidebar.open{transform:translateX(0)}.sidebar-close{display:flex}
  .main{margin-left:0;padding-top:56px}
  .orders-wrap{flex-direction:column}
  .orders-list-panel{width:100%;max-height:40vh;border-right:none;border-bottom:1px solid var(--border)}
  .orders-wrap.show-detail .orders-list-panel{display:none}
  .orders-wrap:not(.show-detail) .order-detail{display:none}
}
</style>
</head>
<body>

<header class="mobile-header">
  <button class="menu-toggle" onclick="toggleSidebar()">&#9776;</button>
  <span style="font-weight:800;color:#f5f5fa">Orders</span>
  <div style="width:40px"></div>
</header>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header"><div class="sidebar-logo"><div class="logo-icon">&#127976;</div><div><h2 id="sidebarHotel">Hotel</h2><p class="hotel-name" id="sidebarDept">Staff</p></div></div><button class="sidebar-close" onclick="toggleSidebar()">&#10005;</button></div>
  <nav class="sidebar-nav">
    <div class="nav-section-title">Dashboard</div>
    <a class="nav-item" href="index.html"><span class="nav-icon">&#128682;</span> Rooms</a>
    <a class="nav-item" href="shift-calendar.html"><span class="nav-icon">&#128197;</span> Shift Calendar</a>
    <a class="nav-item" href="shift-management.html"><span class="nav-icon">&#128203;</span> Shift Management</a>
    <a class="nav-item" href="promotional.html"><span class="nav-icon">&#128227;</span> Promotional Messages</a>
    <a class="nav-item" href="chat.html"><span class="nav-icon">&#128172;</span> Chat <span class="nav-badge" id="chatBadge" style="display:none">0</span></a>
    <a class="nav-item active" href="orders.html"><span class="nav-icon">&#127869;</span> Orders <span class="nav-badge" id="orderBadge" style="display:none">0</span></a>
    <a class="nav-item" href="call.html"><span class="nav-icon">&#128222;</span> Calls</a>
    <a class="nav-item" href="#"><span class="nav-icon">&#128680;</span> Emergencies <span class="nav-badge emergency" id="emergBadge" style="display:none">0</span></a>
    <a class="nav-item" id="pwaInstallNav" href="install-pwa.html" style="display:none;"><span class="nav-icon">📱</span> Install App</a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-info"><div class="user-avatar" id="userAvatar">S</div><div><div class="user-name" id="userName">Staff</div><div class="user-role" id="userRole">Loading...</div></div></div>
    <button class="logout-btn" onclick="logout()">&#128682; Sign Out</button>
  </div>
</aside>

<main class="main">
  <div class="page-header">
    <h1 class="page-title">🛎️ Orders</h1>
    <p class="page-subtitle">Incoming food & beverage orders from guests</p>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="active" onclick="setFilter('active')">Active</button>
    <button class="filter-btn" data-filter="PENDING" onclick="setFilter('PENDING')">Pending</button>
    <button class="filter-btn" data-filter="CONFIRMED" onclick="setFilter('CONFIRMED')">Confirmed</button>
    <button class="filter-btn" data-filter="PREPARING" onclick="setFilter('PREPARING')">Preparing</button>
    <button class="filter-btn" data-filter="READY" onclick="setFilter('READY')">Ready</button>
    <button class="filter-btn" data-filter="DELIVERED" onclick="setFilter('DELIVERED')">Delivered</button>
    <button class="filter-btn" data-filter="all" onclick="setFilter('all')">All</button>
  </div>

  <div class="orders-wrap" id="ordersWrap">
    <div class="orders-list-panel">
      <div class="orders-list" id="ordersList">
        <div class="empty-state"><div class="icon">🛎️</div><p>Loading orders…</p></div>
      </div>
    </div>
    <div class="order-detail" id="orderDetail">
      <div class="order-detail-empty"><div class="icon">🛎️</div><p>Select an order to view details.</p></div>
    </div>
  </div>
</main>

<div class="toast-container" id="toastContainer"></div>

<script>
const API = "https://connectapi.voddic.com.ng/api/v1";
const token = localStorage.getItem("access_token");
const user = JSON.parse(localStorage.getItem("user") || "{}");
const staff = JSON.parse(localStorage.getItem("staff") || "{}");
const hotel = JSON.parse(localStorage.getItem("hotel") || "{}");
if (!token) window.location.href = "/auth/login.html";

const _isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
const API_HOST = _isLocal ? (window.location.hostname + ':8000') : 'connectapi.voddic.com.ng';
const API_BASE = _isLocal ? ('http://' + API_HOST + '/api/v1') : API;

var orders = [];
var activeOrderId = null;
var currentFilter = 'active';
var ws = null, wsReconnectTimer = null;

document.addEventListener("DOMContentLoaded", function() {
  document.getElementById("userName").textContent = user.full_name || user.email || "Staff";
  document.getElementById("userAvatar").textContent = (user.full_name || "S")[0].toUpperCase();
  document.getElementById("userRole").textContent = staff.position || staff.department || "Staff";
  document.getElementById("sidebarHotel").textContent = hotel.name || "Hotel";
  document.getElementById("sidebarDept").textContent = staff.department || "Staff";
  loadOrders();
  connectWS();
});

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("sidebarOverlay").classList.toggle("active");
}
function logout() { localStorage.clear(); window.location.href = "/auth/login.html"; }

async function loadOrders() {
  try {
    var url = API_BASE + "/menu/owner/orders/";
    if (currentFilter === 'active') {
      // fetch all then filter locally
    } else if (currentFilter !== 'all') {
      url += "?status=" + currentFilter;
    }
    var res = await fetch(url, { headers: { "Authorization": "Bearer " + token } });
    if (!res.ok) {
      if (res.status === 401 || res.status === 403) { window.location.href = "/auth/login.html"; return; }
      throw new Error("HTTP " + res.status);
    }
    var all = await res.json();

    if (currentFilter === 'active') {
      orders = all.filter(function(o) {
        return ["PENDING", "CONFIRMED", "PREPARING", "READY"].indexOf(o.status) !== -1;
      });
    } else {
      orders = all;
    }

    renderOrders();
    updateOrderBadge(all);
    if (activeOrderId) {
      var still = orders.find(function(o) { return o.id === activeOrderId; });
      if (still) renderOrderDetail(still);
    }
  } catch (e) {
    console.error("loadOrders", e);
    document.getElementById("ordersList").innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>Could not load orders</p></div>';
  }
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll(".filter-btn").forEach(function(b) {
    b.classList.toggle("active", b.getAttribute("data-filter") === f);
  });
  loadOrders();
}

function renderOrders() {
  var list = document.getElementById("ordersList");
  if (!orders.length) {
    list.innerHTML = '<div class="empty-state"><div class="icon">🛎️</div><p>No ' + (currentFilter === 'active' ? 'active ' : '') + 'orders</p></div>';
    return;
  }
  list.innerHTML = orders.map(function(o) {
    var guestLine = o.guest_display_name && o.guest_display_name !== 'Room ' + o.room_number
      ? `<div class="order-guest-name">${escapeHtml(o.guest_display_name)}</div>` : '';
    return `<div class="order-item ${o.id === activeOrderId ? 'active' : ''}" onclick="openOrder('${o.id}')">
      <div class="order-item-head">
        <div class="order-room">🚪 Room ${escapeHtml(o.room_number || '?')}</div>
        <div class="order-time">${relativeTime(o.created_at)}</div>
      </div>
      ${guestLine}
      <div class="order-meta-row">
        <div class="order-total">₦${Number(o.total).toLocaleString()}</div>
        <span class="order-status status-${o.status}">${o.status}</span>
      </div>
    </div>`;
  }).join("");
}

function openOrder(id) {
  activeOrderId = id;
  var o = orders.find(function(x) { return x.id === id; });
  if (!o) return;
  document.getElementById("ordersWrap").classList.add("show-detail");
  renderOrders();
  renderOrderDetail(o);
}

function renderOrderDetail(o) {
  var el = document.getElementById("orderDetail");
  var next = {
    'PENDING': { status: 'CONFIRMED', label: '✅ Confirm Order' },
    'CONFIRMED': { status: 'PREPARING', label: '🍳 Start Preparing' },
    'PREPARING': { status: 'READY', label: '🔔 Mark Ready' },
    'READY': { status: 'DELIVERED', label: '✅ Mark Delivered' }
  }[o.status];
  var canCancel = ['PENDING', 'CONFIRMED', 'PREPARING', 'READY'].indexOf(o.status) !== -1;

  el.innerHTML = `
    <div class="order-detail-head">
      <div style="display:flex;justify-content:space-between;align-items:start">
        <div>
          <div style="font-size:1.3rem;font-weight:800;color:var(--gold);margin-bottom:2px">🚪 Room ${escapeHtml(o.room_number || '?')}</div>
          <div style="font-size:.88rem;font-weight:600;color:#f0f0f8">${escapeHtml(o.guest_display_name || '')}</div>
          <div style="font-size:.72rem;color:var(--text-dim);margin-top:4px">Order #${o.id.slice(0,8)} · ${new Date(o.created_at).toLocaleString()}</div>
        </div>
        <span class="order-status status-${o.status}">${o.status}</span>
      </div>
    </div>
    <div class="order-detail-body">
      ${o.lines.map(function(l) {
        return `<div class="line-item">
          <div class="line-item-info">
            <div class="line-item-name">${escapeHtml(l.item_name_snapshot)}</div>
            <div class="line-item-qty">× ${l.quantity} @ ₦${Number(l.unit_price_snapshot).toLocaleString()} ${l.notes ? '· ' + escapeHtml(l.notes) : ''}</div>
          </div>
          <div class="line-item-price">₦${Number(l.line_total).toLocaleString()}</div>
        </div>`;
      }).join('')}
      ${o.notes ? `<div class="notes-box"><strong>📝 Notes:</strong> ${escapeHtml(o.notes)}</div>` : ''}
      <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:1.05rem;font-weight:800">
        <span>Total</span>
        <span style="color:var(--gold)">₦${Number(o.total).toLocaleString()}</span>
      </div>
    </div>
    <div class="order-actions">
      ${next ? `<button class="btn btn-primary" onclick="updateStatus('${o.id}','${next.status}')">${next.label}</button>` : ''}
      ${canCancel ? `<button class="btn btn-danger" onclick="updateStatus('${o.id}','CANCELLED')">Cancel Order</button>` : ''}
      <button class="btn btn-outline" onclick="closeDetail()">← Back</button>
    </div>
  `;
}

function closeDetail() {
  activeOrderId = null;
  document.getElementById("ordersWrap").classList.remove("show-detail");
  document.getElementById("orderDetail").innerHTML = '<div class="order-detail-empty"><div class="icon">🛎️</div><p>Select an order to view details.</p></div>';
  renderOrders();
}

async function updateStatus(orderId, newStatus) {
  if (!confirm('Mark order as ' + newStatus + '?')) return;
  try {
    var res = await fetch(API_BASE + "/menu/owner/orders/" + orderId + "/status/", {
      method: "POST",
      headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ status: newStatus })
    });
    if (!res.ok) {
      var e = await res.json();
      showToast(e.error || "Update failed", "error");
      return;
    }
    showToast("Order updated", "success");
    loadOrders();
  } catch (e) { showToast("Network error", "error"); }
}

function updateOrderBadge(allOrders) {
  var active = allOrders.filter(function(o) {
    return ["PENDING", "CONFIRMED", "PREPARING", "READY"].indexOf(o.status) !== -1;
  });
  var pending = allOrders.filter(function(o) { return o.status === 'PENDING'; });
  var badge = document.getElementById("orderBadge");
  if (badge) {
    if (pending.length > 0) {
      badge.textContent = pending.length;
      badge.style.display = "inline-block";
    } else if (active.length > 0) {
      badge.textContent = active.length;
      badge.style.display = "inline-block";
      badge.style.background = "#60a5fa";
    } else {
      badge.style.display = "none";
    }
  }
}

function connectWS() {
  if (!token) return;
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  var proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  var url = proto + '//' + API_HOST + '/ws/chat/staff/?token=' + encodeURIComponent(token);
  try {
    ws = new WebSocket(url);
    ws.onopen = function() { console.log("[staff-orders-ws] connected"); };
    ws.onmessage = function(ev) {
      try {
        var data = JSON.parse(ev.data);
        if (data.event === 'order.created') {
          showToast("🛎️ New order from Room " + (data.order.room_number || '?'), "info");
          beep();
          loadOrders();
        } else if (data.event === 'order.updated') {
          loadOrders();
        }
      } catch (e) {}
    };
    ws.onclose = function() {
      ws = null;
      if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
      wsReconnectTimer = setTimeout(connectWS, 5000);
    };
  } catch (e) {}
}

function beep() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator(); var gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
    osc.start(); osc.stop(ctx.currentTime + 0.2);
  } catch (e) {}
}

function showToast(msg, type) {
  var c = document.getElementById("toastContainer");
  var t = document.createElement("div");
  t.className = "toast " + (type || "info");
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(function() { t.remove(); }, 3000);
}
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function relativeTime(iso) {
  if (!iso) return '';
  try {
    var diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (diff < 60) return 'now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h';
    return Math.floor(diff / 86400) + 'd';
  } catch (e) { return ''; }
}
