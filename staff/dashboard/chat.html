<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chat — Voddic Staff</title>
<meta name="theme-color" content="#0f0f1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c18;--card:#151528;--gold:#e4af3e;--danger:#e2412c;--success:#2fa06a;--warning:#f59e0b;--info:#3b82f6;--text:#eaeaf0;--text-dim:#8a8aa8;--border:rgba(255,255,255,.06)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;display:flex;overflow:hidden}
a{text-decoration:none;color:inherit}button{border:none;background:none;cursor:pointer;font-family:inherit;color:inherit}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#12121f}::-webkit-scrollbar-thumb{background:#2a2a45;border-radius:3px}

/* Sidebar */
.sidebar{position:fixed;top:0;left:0;width:272px;height:100vh;background:#101020;border-right:1px solid rgba(255,255,255,.06);z-index:1200;display:flex;flex-direction:column;overflow-y:auto;transition:transform .35s}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
.sidebar-logo{display:flex;align-items:center;gap:12px}.logo-icon{font-size:1.6rem}
.sidebar-logo h2{font-size:.95rem;font-weight:800;color:#f5f5fa}
.hotel-name{font-size:.72rem;color:var(--text-dim);margin-top:2px}
.sidebar-close{display:none;width:32px;height:32px;align-items:center;justify-content:center;font-size:1rem;color:var(--text-dim)}
.sidebar-nav{flex:1;padding:12px 0}
.nav-section-title{font-size:.62rem;font-weight:700;color:#55556e;letter-spacing:.08em;text-transform:uppercase;padding:14px 20px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:.82rem;font-weight:500;color:#9a9ab8;transition:all .18s;border-left:3px solid transparent;cursor:pointer}
.nav-item:hover{color:#e0e0f0;background:rgba(255,255,255,.03)}
.nav-item.active{color:#f0f0f8;background:rgba(228,175,62,.08);border-left-color:var(--gold)}
.nav-icon{font-size:.95rem;width:22px;text-align:center}
.nav-badge{margin-left:auto;font-size:.65rem;font-weight:700;background:var(--gold);color:#000;padding:2px 7px;border-radius:10px;min-width:20px;text-align:center}
.nav-badge.emergency{background:var(--danger);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.sidebar-footer{padding:16px 18px;border-top:1px solid var(--border)}
.user-info{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.user-avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--gold),#c48a20);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;color:#000}
.user-name{font-size:.82rem;font-weight:600}.user-role{font-size:.7rem;color:var(--text-dim)}
.logout-btn{width:100%;padding:9px 14px;font-size:.78rem;font-weight:600;color:#b0b0c8;border-radius:8px;text-align:left}
.logout-btn:hover{background:rgba(229,69,69,.1);color:#e54545}

/* Main chat layout */
.main{margin-left:272px;flex:1;display:flex;height:100vh;overflow:hidden}
.mobile-bar{display:none;position:fixed;top:0;left:0;right:0;height:56px;background:rgba(12,12,24,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);z-index:1000;align-items:center;justify-content:space-between;padding:0 16px}
.menu-toggle{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;border-radius:10px;background:rgba(255,255,255,.05)}

/* Left pane — threads */
.chat-tabs{display:flex;gap:6px;padding:12px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.chat-tab{padding:8px 16px;font-size:.8rem;font-weight:600;color:var(--text-dim);border-radius:8px;transition:all .2s}
.chat-tab.active{background:rgba(228,175,62,.15);color:var(--gold)}
.chat-tab:hover{color:var(--text)}
.threads-pane{width:320px;background:#101020;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.threads-header{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.threads-header h2{font-size:1rem;font-weight:800;color:#f5f5fa}
.threads-count{font-size:.7rem;font-weight:700;background:rgba(228,175,62,.15);color:var(--gold);padding:2px 10px;border-radius:10px}
.threads-search{padding:0 14px 10px}
.threads-search input{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.78rem;outline:none;font-family:inherit}
.threads-search input:focus{border-color:var(--gold)}
.threads-list{flex:1;overflow-y:auto;padding:4px 0}
.thread-item{padding:12px 16px;border-left:3px solid transparent;cursor:pointer;transition:all .15s;border-bottom:1px solid rgba(255,255,255,.02)}
.thread-item:hover{background:rgba(255,255,255,.03)}
.thread-item.active{background:rgba(228,175,62,.08);border-left-color:var(--gold)}
.thread-row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.thread-room{font-size:.85rem;font-weight:700;color:#f0f0f8}
.thread-time{font-size:.65rem;color:#55556e}
.thread-row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.thread-dept{font-size:.68rem;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.03em}
.thread-unread{font-size:.65rem;font-weight:700;background:var(--danger);color:#fff;padding:1px 7px;border-radius:10px;min-width:18px;text-align:center}
.thread-preview{font-size:.72rem;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;margin-top:2px}
.threads-empty{padding:40px 20px;text-align:center;color:#55556e;font-size:.82rem}
.threads-empty .icon{font-size:2.5rem;margin-bottom:10px;opacity:.5}

/* Right pane — conversation */
.convo-pane{flex:1;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.convo-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:#101020;flex-shrink:0}
.convo-title{font-size:.95rem;font-weight:700;color:#f0f0f8}
.convo-subtitle{font-size:.72rem;color:var(--text-dim)}
.convo-back{display:none;width:36px;height:36px;align-items:center;justify-content:center;font-size:1.1rem;border-radius:8px;background:rgba(255,255,255,.05);margin-right:4px}
.convo-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;background:radial-gradient(rgba(250,246,236,.02) 1px,transparent 1px);background-size:16px 16px}
.msg{max-width:75%;padding:10px 14px;border-radius:14px;font-size:.85rem;line-height:1.5;word-wrap:break-word}
.msg.guest{align-self:flex-start;background:#1a2540;border-bottom-left-radius:4px}
.msg.staff,.msg.owner,.msg.manager{align-self:flex-end;background:linear-gradient(135deg,#e4af3e,#c98e22);color:#000;border-bottom-right-radius:4px}
.msg.system{align-self:center;background:rgba(255,255,255,.05);color:var(--text-dim);font-size:.72rem;font-style:italic;max-width:90%}
.msg-meta{font-size:.62rem;opacity:.65;margin-top:4px}
.msg.guest .msg-meta{color:#9aa6c2}
.msg.staff .msg-meta,.msg.owner .msg-meta,.msg.manager .msg-meta{color:#3a2a00}
.convo-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;color:#55556e}
.convo-empty .icon{font-size:3rem;margin-bottom:14px;opacity:.4}
.convo-empty p{font-size:.88rem;max-width:320px}
.convo-input{display:flex;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--border);background:#101020;flex-shrink:0}
.convo-input input{flex:1;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:24px;color:var(--text);font-size:.86rem;outline:none;font-family:inherit}
.convo-input input:focus{border-color:var(--gold)}
.send-btn{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#e4af3e,#c98e22);display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#000;flex-shrink:0;transition:transform .15s}
.send-btn:active{transform:scale(.94)}
.send-btn:disabled{opacity:.4;cursor:not-allowed}

.toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:6px}
.toast{padding:10px 16px;border-radius:6px;font-size:.72rem;font-weight:600;color:#f0f0f8;background:#1e1e38;border:1px solid rgba(255,255,255,.08);animation:slideIn .3s ease;max-width:260px}
.toast.success{border-left:3px solid #34d399}.toast.info{border-left:3px solid #60a5fa}.toast.error{border-left:3px solid #e54545}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

@media(max-width:900px){
  .main{margin-left:0;padding-top:56px;flex-direction:column}
  .mobile-bar{display:flex}
  .sidebar{transform:translateX(-100%);width:280px}.sidebar.open{transform:translateX(0)}.sidebar-close{display:flex}
  .threads-pane{width:100%;border-right:none}
  .main.show-thread .threads-pane{display:none}
  .main:not(.show-thread) .convo-pane{display:none}
  .convo-back{display:flex}
}
</style>
</head>
<body>

<header class="mobile-bar">
  <button class="menu-toggle" onclick="toggleSidebar()">&#9776;</button>
  <div style="font-weight:800;color:#f5f5fa">Chat</div>
  <div style="width:40px"></div>
</header>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()" style="position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:1100;display:none"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header"><div class="sidebar-logo"><div class="logo-icon">&#127976;</div><div><h2 id="sidebarHotel">Hotel</h2><p class="hotel-name" id="sidebarDept">Staff</p></div></div><button class="sidebar-close" onclick="toggleSidebar()">&#10005;</button></div>
  <nav class="sidebar-nav">
    <div class="nav-section-title">Dashboard</div>
    <a class="nav-item" data-tab="rooms" href="index.html"><span class="nav-icon">&#128682;</span> Rooms</a>
    <a class="nav-item" data-tab="shift" href="shift-calendar.html"><span class="nav-icon">&#128197;</span> Shift Calendar</a>
    <a class="nav-item" data-tab="shiftmgmt" href="shift-management.html"><span class="nav-icon">&#128203;</span> Shift Management</a>
    <a class="nav-item" data-tab="promotional" href="promotional.html"><span class="nav-icon">&#128227;</span> Promotional Messages</a>
    <a class="nav-item active" data-tab="chat" href="chat.html"><span class="nav-icon">&#128172;</span> Chat <span class="nav-badge" id="chatBadge" style="display:none">0</span></a>
    <a class="nav-item" href="call.html"><span class="nav-icon">&#128222;</span> Calls</a>
    <a class="nav-item" data-tab="emergency" href="#"><span class="nav-icon">&#128680;</span> Emergencies <span class="nav-badge emergency" id="emergBadge" style="display:none">0</span></a>
    <a class="nav-item" id="pwaInstallNav" href="install-pwa.html" style="display:none;"><span class="nav-icon">📱</span> Install App</a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-info"><div class="user-avatar" id="userAvatar">S</div><div><div class="user-name" id="userName">Staff</div><div class="user-role" id="userRole">Loading...</div></div></div>
    <button class="logout-btn" onclick="logout()">&#128682; Sign Out</button>
  </div>
</aside>

<main class="main" id="main">
  <div class="threads-pane">
    <div class="threads-header">
      <h2>Inbox</h2>
      <span class="threads-count" id="threadsCount">0</span>
    </div>
    <div class="threads-search">
      <input type="text" id="threadSearch" placeholder="Search by room or guest..." oninput="filterThreads()">
    </div>
    <div class="threads-list" id="threadsList">
      <div class="threads-empty"><div class="icon">💬</div><p>Loading conversations…</p></div>
    </div>
  </div>

  <div class="convo-pane" id="convoPane">
    <div class="convo-header" id="convoHeader" style="display:none">
      <button class="convo-back" onclick="backToThreads()">←</button>
      <div style="flex:1">
        <div class="convo-title" id="convoTitle">—</div>
        <div class="convo-subtitle" id="convoSubtitle">—</div>
      </div>
    </div>
    <div class="convo-messages" id="convoMessages">
      <div class="convo-empty"><div class="icon">💬</div><p>Select a conversation from the inbox to view messages.</p></div>
    </div>
    <div class="convo-input" id="convoInput" style="display:none">
      <input type="text" id="msgInput" placeholder="Type your reply..." onkeydown="if(event.key==='Enter')sendMessage()">
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>
</main>

<div class="toast-container" id="toastContainer"></div>

<script>
// ============================================================
// Staff Chat Dashboard
// ============================================================
const API = "https://connectapi.voddic.com.ng/api/v1";
const token = localStorage.getItem("access_token");
const user = JSON.parse(localStorage.getItem("user") || "{}");
const hotel = JSON.parse(localStorage.getItem("hotel") || "{}");
const staff = JSON.parse(localStorage.getItem("staff") || "{}");

if (!token) window.location.href = "/auth/login.html";

var threads = [];
var currentTab = 'live';
var activeThreadId = null;
var activeThreadMessages = [];
var ws = null;
var wsReconnectTimer = null;
var unreadTotal = 0;
var searchQuery = '';

document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("userName").textContent = user.full_name || user.email || "Staff";
    document.getElementById("userAvatar").textContent = (user.full_name || user.email || "S")[0].toUpperCase();
    document.getElementById("userRole").textContent = staff.position || staff.department || "Staff";
    document.getElementById("sidebarHotel").textContent = hotel.name || "Hotel";
    document.getElementById("sidebarDept").textContent = staff.department || "Staff";

    // Hide PWA install nav if already installed
    if (window.matchMedia('(display-mode: standalone)').matches) {
        var pwa = document.getElementById("pwaInstallNav");
        if (pwa) pwa.style.display = "none";
    }

    loadThreads();
    connectWS();
});

// ============================================================
// Sidebar (same as rest of staff dashboard)
// ============================================================
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("open");
    var ov = document.getElementById("sidebarOverlay");
    ov.style.display = ov.style.display === "block" ? "none" : "block";
}
function logout() {
    localStorage.clear();
    window.location.href = "/auth/login.html";
}
function showToast(msg, type) {
    var c = document.getElementById("toastContainer");
    var t = document.createElement("div");
    t.className = "toast " + (type || "info");
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(function () { t.remove(); }, 3000);
}

// ============================================================
// Threads list
// ============================================================
async function loadThreads() {
    try {
        var res = await fetch(API + "/chat/staff/threads/", {
            headers: { "Authorization": "Bearer " + token }
        });
        if (!res.ok) {
            if (res.status === 401 || res.status === 403) {
                window.location.href = "/auth/login.html";
                return;
            }
            throw new Error("HTTP " + res.status);
        }
        threads = await res.json();
        renderThreads();
        updateUnreadTotal();
    } catch (e) {
        console.error("loadThreads", e);
        document.getElementById("threadsList").innerHTML =
            '<div class="threads-empty"><div class="icon">⚠️</div><p>Could not load conversations</p></div>';
    }
}

function renderThreads() {
    var list = document.getElementById("threadsList");
    var filtered = threads.filter(function (t) {
        if (!searchQuery) return true;
        var q = searchQuery.toLowerCase();
        return (t.guest_display_name || '').toLowerCase().indexOf(q) !== -1 ||
               (t.room_number || '').toLowerCase().indexOf(q) !== -1 ||
               (t.department_name || '').toLowerCase().indexOf(q) !== -1;
    });

    document.getElementById("threadsCount").textContent = filtered.length;

    if (!filtered.length) {
        list.innerHTML = '<div class="threads-empty"><div class="icon">💬</div><p>' +
            (searchQuery ? 'No matches' : 'No conversations yet') + '</p></div>';
        return;
    }

    list.innerHTML = filtered.map(function (t) {
        var isActive = t.id === activeThreadId;
        var unread = t.unread_by_staff || 0;
        return '<div class="thread-item' + (isActive ? ' active' : '') + '" onclick="openThread(\'' + t.id + '\')">' +
            '<div class="thread-row1">' +
                '<div class="thread-room">' + escapeHtml(t.guest_display_name || 'Room ' + (t.room_number || '?')) + '</div>' +
                '<div class="thread-time">' + relativeTime(t.last_message_at) + '</div>' +
            '</div>' +
            '<div class="thread-row2">' +
                '<div class="thread-dept">' + escapeHtml(t.department_name || '') + '</div>' +
                (unread > 0 ? '<span class="thread-unread">' + unread + '</span>' : '') +
            '</div>' +
            '<div class="thread-preview">' + escapeHtml(t.last_message_preview || 'No messages yet') + '</div>' +
        '</div>';
    }).join('');
}

function filterThreads() {
    searchQuery = document.getElementById("threadSearch").value.trim();
    renderThreads();
}

function updateUnreadTotal() {
    unreadTotal = threads.reduce(function (sum, t) { return sum + (t.unread_by_staff || 0); }, 0);
    var badge = document.getElementById("chatBadge");
    if (unreadTotal > 0) {
        badge.textContent = unreadTotal;
        badge.style.display = "inline-block";
    } else {
        badge.style.display = "none";
    }
}

// ============================================================
// Open thread
// ============================================================
function switchChatTab(tab) {
  currentTab = tab;
  activeThreadId = null;
  activeThreadMessages = [];
  document.getElementById("convoHeader").style.display = "none";
  document.getElementById("convoInput").style.display = "none";
  document.getElementById("convoMessages").innerHTML =
    '<div class="convo-empty"><div class="icon">💬</div><p>Select a conversation.</p></div>';
  var cb = document.getElementById("chatBody");
  if (cb) cb.classList.remove("show-thread");
  document.querySelectorAll(".chat-tab").forEach(function(t) {
    t.classList.toggle("active", t.getAttribute("data-tab") === tab);
  });
  loadThreads();
}

async function openThread(threadId) {
    activeThreadId = threadId;
    activeThreadMessages = [];

    var t = threads.find(function (x) { return x.id === threadId; });
    if (!t) return;

    document.getElementById("convoHeader").style.display = "flex";
    document.getElementById("convoInput").style.display = (currentTab === "live") ? "flex" : "none";
    document.getElementById("convoTitle").textContent = t.guest_display_name || ('Room ' + (t.room_number || '?'));
    document.getElementById("convoSubtitle").textContent = t.department_name || '';
    document.getElementById("convoMessages").innerHTML = '<div class="convo-empty"><div class="icon">⌛</div><p>Loading messages…</p></div>';
    document.getElementById("main").classList.add("show-thread");
    document.getElementById("msgInput").focus();

    try {
        var res = await fetch(API + "/chat/staff/threads/" + threadId + "/messages/", {
            headers: { "Authorization": "Bearer " + token }
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        activeThreadMessages = await res.json();
        renderMessages();
        // Clear unread locally
        if (currentTab === "live") {
      t.unread_by_staff = 0;
      updateUnreadTotal();
      renderThreads();
    }
    } catch (e) {
        console.error("openThread", e);
        document.getElementById("convoMessages").innerHTML = '<div class="convo-empty"><div class="icon">⚠️</div><p>Could not load messages</p></div>';
    }
}

function backToThreads() {
    document.getElementById("main").classList.remove("show-thread");
    activeThreadId = null;
}

function renderMessages() {
    var box = document.getElementById("convoMessages");
    if (!activeThreadMessages.length) {
        box.innerHTML = '<div class="convo-empty"><div class="icon">💬</div><p>No messages in this thread yet.</p></div>';
        return;
    }
    box.innerHTML = activeThreadMessages.map(function (m) {
        return '<div class="msg ' + (m.sender_type || 'guest') + '">' +
            escapeHtml(m.content || '') +
            '<div class="msg-meta">' + escapeHtml(m.sender_name || '') + ' · ' + formatTime(m.created_at) + '</div>' +
        '</div>';
    }).join('');
    box.scrollTop = box.scrollHeight;
}

function appendMessage(m) {
    // dedupe
    for (var i = 0; i < activeThreadMessages.length; i++) {
        if (activeThreadMessages[i].id === m.id) return;
    }
    activeThreadMessages.push(m);
    var box = document.getElementById("convoMessages");
    var div = document.createElement("div");
    div.className = "msg " + (m.sender_type || 'guest');
    div.innerHTML = escapeHtml(m.content || '') +
        '<div class="msg-meta">' + escapeHtml(m.sender_name || '') + ' · ' + formatTime(m.created_at) + '</div>';
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

// ============================================================
// Send message
// ============================================================
async function sendMessage() {
    if (!activeThreadId || currentTab !== "live") return;
    var inp = document.getElementById("msgInput");
    var text = inp.value.trim();
    if (!text) return;

    var btn = document.getElementById("sendBtn");
    btn.disabled = true;
    inp.value = "";

    // Optimistic append
    var optimistic = {
        id: 'pending-' + Date.now(),
        sender_type: 'staff',
        sender_name: (user.full_name || user.email) + ' (' + (staff.department || 'Staff') + ')',
        content: text,
        created_at: new Date().toISOString()
    };
    appendMessage(optimistic);

    try {
        var res = await fetch(API + "/chat/staff/threads/" + activeThreadId + "/messages/", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ content: text })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        var real = await res.json();
        // Replace pending with real (dedupe handles the WS echo)
        for (var i = 0; i < activeThreadMessages.length; i++) {
            if (activeThreadMessages[i].id === optimistic.id) {
                activeThreadMessages[i] = real;
                break;
            }
        }
        renderMessages();
    } catch (e) {
        console.error("sendMessage", e);
        showToast("Failed to send", "error");
    } finally {
        btn.disabled = false;
        inp.focus();
    }
}

// ============================================================
// WebSocket
// ============================================================
function connectWS() {
    if (!token) return;
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

    var proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    var host = 'connectapi.voddic.com.ng';
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ||
        window.location.hostname.match(/^\d+\.\d+\.\d+\.\d+$/)) {
        host = window.location.hostname + ':8000';
    }
    var url = proto + '//' + host + '/ws/chat/staff/?token=' + encodeURIComponent(token);

    try {
        ws = new WebSocket(url);
        ws.onopen = function () { console.log("[staff-ws] connected"); };
        ws.onmessage = function (ev) {
            try {
                var data = JSON.parse(ev.data);
                if (data.event === 'chat_message') handleIncomingMessage(data);
                else if (data.event === 'thread_update') handleThreadUpdate(data);
            } catch (e) { console.error("[staff-ws] parse", e); }
        };
        ws.onclose = function () {
            ws = null;
            if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
            wsReconnectTimer = setTimeout(connectWS, 5000);
        };
        ws.onerror = function (err) { console.error("[staff-ws] error", err); };
    } catch (e) {
        console.error("[staff-ws] connect fail", e);
    }
}

function handleIncomingMessage(data) {
    var msg = data.message;
    var threadId = data.thread_id;

    // If current thread → append live, BUT skip if it's my own message
    // (the REST response already added it; WS echo would duplicate)
    if (threadId === activeThreadId) {
        if (msg.sender_type === 'staff' || msg.sender_type === 'manager' || msg.sender_type === 'owner') {
            return;  // my own message coming back — already rendered by sendMessage
        }
        appendMessage(msg);
    }

    // Beep if message is from guest AND not currently open thread
    if (msg.sender_type === 'guest' && threadId !== activeThreadId) {
        beep();
        showToast('New message from ' + (msg.sender_name || 'guest'), 'info');
    }


}

function handleThreadUpdate(data) {
    var incoming = data.thread;
    var existingIdx = threads.findIndex(function (t) { return t.id === incoming.id; });
    if (existingIdx >= 0) {
        threads[existingIdx] = incoming;
    } else {
        threads.unshift(incoming);
    }
    renderThreads();
    updateUnreadTotal();
}

// ============================================================
// Notifications beep
// ============================================================
function beep() {
    try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
    } catch (e) {}
}

// ============================================================
// Helpers
// ============================================================
function escapeHtml(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function formatTime(iso) {
    if (!iso) return '';
    try {
        var d = new Date(iso);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    } catch (e) { return ''; }
}
function relativeTime(iso) {
    if (!iso) return '';
    try {
        var then = new Date(iso).getTime();
        var diff = Math.floor((Date.now() - then) / 1000);
        if (diff < 60) return 'now';
        if (diff < 3600) return Math.floor(diff / 60) + 'm';
        if (diff < 86400) return Math.floor(diff / 3600) + 'h';
        return Math.floor(diff / 86400) + 'd';
    } catch (e) { return ''; }
}
