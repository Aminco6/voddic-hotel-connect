<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reset Password — Voddic Hotel Connect</title>
    <link rel="stylesheet" href="auth.css">
    <style>
        .code-box {
            background: var(--input-bg);
            border: 2px dashed var(--gold);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            margin: 14px 0;
        }
        .code-input {
            width: 100%; padding: 12px;
            background: transparent; border: none;
            color: var(--text); font-size: 26px;
            text-align: center; letter-spacing: 8px;
            font-family: 'Courier New', monospace; font-weight: bold;
            outline: none; text-transform: uppercase;
        }
        .code-input::placeholder {
            letter-spacing: 2px; font-size: 14px;
            color: var(--text-dim); font-family: 'Inter', sans-serif;
        }
        .step { display: none; }
        .step.active { display: block; }
        .email-display {
            background: rgba(201,168,106,0.1);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--gold);
            text-align: center;
            margin-bottom: 16px;
            word-break: break-all;
        }
        .btn-primary { width: 100%; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="auth-container">
        <a href="login.html" class="back-link">← Back to sign in</a>

        <div class="auth-header">
            <div class="logo-container">🔑</div>
            <h1 class="hotel-name">Reset Password</h1>
            <p class="subtitle" id="stepTitle">Enter your email to receive a reset code</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <!-- Step 1: Enter Email -->
        <div class="step active" id="stepEmail">
            <form id="forgotForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <span class="input-icon">📧</span>
                    <input type="email" id="emailInput" placeholder="you@hotel.com" required autocomplete="email" autofocus>
                </div>
                <button type="submit" class="btn-primary" id="emailBtn">
                    <span id="emailBtnText">Send Reset Code</span>
                    <span id="emailBtnLoader" style="display:none;">Sending...</span>
                </button>
            </form>
        </div>

        <!-- Step 2: Enter Code (verify first) -->
        <div class="step" id="stepCode">
            <div class="email-display" id="emailDisplay"></div>
            
            <form id="codeVerifyForm">
                <div class="form-group">
                    <label>Reset Code from Email</label>
                    <div class="code-box">
                        <input type="text" class="code-input" id="codeInput" placeholder="XXXXXXXX" maxlength="8" autocomplete="off" autocapitalize="characters">
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="verifyBtn">
                    <span id="verifyBtnText">Verify Code</span>
                    <span id="verifyBtnLoader" style="display:none;">Verifying...</span>
                </button>
            </form>

            <p style="text-align:center;margin-top:14px;font-size:12px;color:var(--text-dim);">
                Didn't get the code? 
                <a href="#" onclick="goBackToEmail()" style="color:var(--gold);">Try a different email</a>
            </p>
        </div>

        <!-- Step 3: Set New Password (only shown after code verified) -->
        <div class="step" id="stepPassword">
            <div class="email-display" id="verifiedEmailDisplay"></div>
            <div class="success-message" style="display:block;margin-bottom:16px;">✅ Code verified!</div>

            <form id="resetForm">
                <div class="form-group">
                    <label>New Password</label>
                    <span class="input-icon">🔒</span>
                    <input type="password" id="newPassword" placeholder="Min 8 characters" required minlength="8" autocomplete="new-password">
                    <div class="password-strength">
                        <div class="password-strength-bar" id="passwordStrength"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <span class="input-icon">🔒</span>
                    <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
                </div>

                <button type="submit" class="btn-primary" id="resetBtn">
                    <span id="resetBtnText">Reset Password</span>
                    <span id="resetBtnLoader" style="display:none;">Resetting...</span>
                </button>
            </form>
        </div>

        <p class="footer-text">
            Remember your password? <a href="login.html" style="color:var(--gold);">Sign in</a>
        </p>
    </div>

    <script>
    const API = 'https://connectapi.voddic.com.ng/api/v1/auth';
    let userEmail = '';
    let verifiedToken = '';

    // Password strength
    document.getElementById('newPassword').addEventListener('input', () => {
        const bar = document.getElementById('passwordStrength');
        if (!bar) return;
        const v = document.getElementById('newPassword').value;
        let sc = 0;
        if (v.length >= 8) sc++;
        if (/[A-Z]/.test(v)) sc++;
        if (/[0-9]/.test(v)) sc++;
        if (/[^A-Za-z0-9]/.test(v)) sc++;
        bar.className = 'password-strength-bar';
        if (!v) bar.style.width = '0';
        else if (sc <= 1) bar.classList.add('strength-weak');
        else if (sc === 2) bar.classList.add('strength-fair');
        else if (sc === 3) bar.classList.add('strength-good');
        else bar.classList.add('strength-strong');
    });

    function clearMessages() {
        document.getElementById('errorMessage').classList.remove('show');
        document.getElementById('successMessage').classList.remove('show');
    }

    function showError(msg) {
        const el = document.getElementById('errorMessage');
        el.textContent = msg;
        el.classList.add('show');
    }

    // Step 1: Send reset code
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearMessages();
        
        const email = document.getElementById('emailInput').value.trim();
        if (!email) { showError('Please enter your email'); return; }

        const btn = document.getElementById('emailBtn');
        btn.disabled = true;
        document.getElementById('emailBtnText').style.display = 'none';
        document.getElementById('emailBtnLoader').style.display = 'inline';

        try {
            const res = await fetch(`${API}/forgot-password/`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email})
            });
            const data = await res.json();
            
            if (data.success) {
                userEmail = email;
                document.getElementById('emailDisplay').textContent = 'Code sent to: ' + email;
                
                // Show step 2
                document.getElementById('stepEmail').classList.remove('active');
                document.getElementById('stepCode').classList.add('active');
                document.getElementById('stepTitle').textContent = 'Enter the code from your email';
                
                document.getElementById('successMessage').textContent = 'Reset code sent! Check your inbox.';
                document.getElementById('successMessage').classList.add('show');
            } else {
                showError(data.message || 'Failed to send code');
            }
        } catch(err) {
            showError('Network error. Please try again.');
        } finally {
            btn.disabled = false;
            document.getElementById('emailBtnText').style.display = 'inline';
            document.getElementById('emailBtnLoader').style.display = 'none';
        }
    });

    // Step 2: Verify the code
    document.getElementById('codeVerifyForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearMessages();
        
        const code = document.getElementById('codeInput').value.trim().toUpperCase();
        if (!code || code.length < 4) { showError('Please enter the reset code from your email'); return; }

        const btn = document.getElementById('verifyBtn');
        btn.disabled = true;
        document.getElementById('verifyBtnText').style.display = 'none';
        document.getElementById('verifyBtnLoader').style.display = 'inline';

        try {
            // Verify code with backend
            const res = await fetch(`${API}/verify-reset-code/`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({token: code})
            });
            const data = await res.json();
            
            if (data.success) {
                verifiedToken = code;
                document.getElementById('verifiedEmailDisplay').textContent = 'Verified: ' + (data.email || userEmail);
                
                // Show step 3
                document.getElementById('stepCode').classList.remove('active');
                document.getElementById('stepPassword').classList.add('active');
                document.getElementById('stepTitle').textContent = 'Set your new password';
                
                document.getElementById('successMessage').textContent = '';
                document.getElementById('successMessage').classList.remove('show');
            } else {
                showError(data.message || 'Invalid or expired code. Please request a new one.');
            }
        } catch(err) {
            showError('Network error. Please try again.');
        } finally {
            btn.disabled = false;
            document.getElementById('verifyBtnText').style.display = 'inline';
            document.getElementById('verifyBtnLoader').style.display = 'none';
        }
    });

    // Step 3: Reset password
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearMessages();
        
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!newPassword || newPassword.length < 8) { showError('Password must be at least 8 characters'); return; }
        if (newPassword !== confirmPassword) { showError('Passwords do not match'); return; }
        if (!verifiedToken) { showError('Session expired. Please start over.'); return; }

        const btn = document.getElementById('resetBtn');
        btn.disabled = true;
        document.getElementById('resetBtnText').style.display = 'none';
        document.getElementById('resetBtnLoader').style.display = 'inline';

        try {
            const res = await fetch(`${API}/reset-password/`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({token: verifiedToken, password: newPassword})
            });
            const data = await res.json();
            
            if (data.success) {
                document.getElementById('successMessage').textContent = 'Password reset! Redirecting to sign in...';
                document.getElementById('successMessage').classList.add('show');
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
            } else {
                showError(data.message || 'Reset failed. Code may have expired.');
            }
        } catch(err) {
            showError('Network error. Please try again.');
        } finally {
            btn.disabled = false;
            document.getElementById('resetBtnText').style.display = 'inline';
            document.getElementById('resetBtnLoader').style.display = 'none';
        }
    });

    function goBackToEmail() {
        document.getElementById('stepCode').classList.remove('active');
        document.getElementById('stepPassword').classList.remove('active');
        document.getElementById('stepEmail').classList.add('active');
        document.getElementById('stepTitle').textContent = 'Enter your email to receive a reset code';
        clearMessages();
        verifiedToken = '';
    }
    </script>
</body>
</html>
