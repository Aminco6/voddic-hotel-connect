<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reset Password — Voddic Hotel Connect</title>
    <link rel="stylesheet" href="auth.css">
    <style>
        .code-box {
            background: var(--input-bg);
            border: 2px dashed var(--gold);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            margin: 14px 0;
        }
        .code-input {
            width: 100%; padding: 12px;
            background: transparent; border: none;
            color: var(--text); font-size: 26px;
            text-align: center; letter-spacing: 8px;
            font-family: 'Courier New', monospace; font-weight: bold;
            outline: none; text-transform: uppercase;
        }
        .code-input::placeholder {
            letter-spacing: 2px; font-size: 14px;
            color: var(--text-dim); font-family: 'Inter', sans-serif;
        }
        .verify-btn {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, var(--gold), #b8943a);
            border: none; border-radius: 12px; color: #000;
            font-size: 15px; font-weight: 700; cursor: pointer;
        }
        .verify-btn:disabled { opacity: .6; }
        .step { display: none; }
        .step.active { display: block; }
    </style>
</head>
<body>
    <div class="auth-container">
        <a href="login.html" class="back-link">← Back to sign in</a>

        <div class="auth-header">
            <div class="logo-container">🔐</div>
            <h1 class="hotel-name">Reset Password</h1>
            <p class="subtitle" id="stepTitle">Enter the code sent to your email</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <!-- Step 1: Enter Code -->
        <div class="step active" id="stepCode">
            <div class="code-box">
                <input type="text" class="code-input" id="codeInput" placeholder="XXXXXXXX" maxlength="8" autocomplete="off" autocapitalize="characters">
            </div>
            <button class="verify-btn" id="verifyBtn" onclick="verifyCode()">Verify Code</button>
        </div>

        <!-- Step 2: Set New Password -->
        <div class="step" id="stepPassword">
            <form id="resetForm">
                <div class="form-group">
                    <label>New Password</label>
                    <span class="input-icon">🔒</span>
                    <input type="password" id="newPassword" placeholder="Min 8 characters" required minlength="8" autocomplete="new-password">
                    <div class="password-strength">
                        <div class="password-strength-bar" id="passwordStrength"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <span class="input-icon">🔒</span>
                    <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">
                    <span id="submitText">Reset Password</span>
                    <span id="submitLoader" style="display:none;">Resetting...</span>
                </button>
            </form>
        </div>
    </div>

    <script>
    const API = 'https://connectapi.voddic.com.ng/api/v1/auth';
    const params = new URLSearchParams(window.location.search);
    const urlToken = params.get('token');
    let verifiedToken = null;

    // Auto-fill token from URL
    if (urlToken) {
        document.getElementById('codeInput').value = urlToken;
    }

    // Password strength
    document.getElementById('newPassword').addEventListener('input', () => {
        const bar = document.getElementById('passwordStrength');
        if (!bar) return;
        const v = document.getElementById('newPassword').value;
        let sc = 0;
        if (v.length >= 8) sc++;
        if (/[A-Z]/.test(v)) sc++;
        if (/[0-9]/.test(v)) sc++;
        if (/[^A-Za-z0-9]/.test(v)) sc++;
        bar.className = 'password-strength-bar';
        if (!v) bar.style.width = '0';
        else if (sc <= 1) bar.classList.add('strength-weak');
        else if (sc === 2) bar.classList.add('strength-fair');
        else if (sc === 3) bar.classList.add('strength-good');
        else bar.classList.add('strength-strong');
    });

    // Verify code
    async function verifyCode() {
        const code = document.getElementById('codeInput').value.trim().toUpperCase();
        const errorEl = document.getElementById('errorMessage');
        errorEl.classList.remove('show');

        if (!code || code.length < 4) {
            errorEl.textContent = 'Please enter the reset code';
            errorEl.classList.add('show');
            return;
        }

        const btn = document.getElementById('verifyBtn');
        btn.disabled = true;
        btn.textContent = 'Verifying...';

        try {
            // Just verify the token exists (by trying to use it)
            const res = await fetch(`${API}/reset-password/`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({token: code, password: 'test123456'}) // This will fail but we can check response
            });
            const data = await res.json();
            
            // If it says "password must be 8 chars" then the token is valid
            if (data.message && data.message.includes('Password must be')) {
                verifiedToken = code;
                showPasswordStep();
            } else if (data.message && data.message.includes('Invalid')) {
                errorEl.textContent = 'Invalid or expired code. Please request a new one.';
                errorEl.classList.add('show');
            } else {
                // Token might be valid, let's allow proceeding
                verifiedToken = code;
                showPasswordStep();
            }
        } catch(e) {
            // If network error, still allow proceeding
            verifiedToken = code;
            showPasswordStep();
        } finally {
            btn.disabled = false;
            btn.textContent = 'Verify Code';
        }
    }

    function showPasswordStep() {
        document.getElementById('stepCode').classList.remove('active');
        document.getElementById('stepPassword').classList.add('active');
        document.getElementById('stepTitle').textContent = 'Set your new password';
    }

    // Reset password
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const errorEl = document.getElementById('errorMessage');
        const successEl = document.getElementById('successMessage');
        const btn = document.getElementById('submitBtn');

        errorEl.classList.remove('show');
        successEl.classList.remove('show');

        if (!newPassword || newPassword.length < 8) {
            errorEl.textContent = 'Password must be at least 8 characters';
            errorEl.classList.add('show');
            return;
        }
        if (newPassword !== confirmPassword) {
            errorEl.textContent = 'Passwords do not match';
            errorEl.classList.add('show');
            return;
        }

        btn.disabled = true;
        document.getElementById('submitText').style.display = 'none';
        document.getElementById('submitLoader').style.display = 'inline';

        try {
            const res = await fetch(`${API}/reset-password/`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({token: verifiedToken || urlToken, password: newPassword})
            });
            const data = await res.json();
            
            if (data.success) {
                successEl.textContent = 'Password reset! Redirecting to sign in...';
                successEl.classList.add('show');
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
            } else {
                errorEl.textContent = data.message || 'Reset failed. Link may have expired.';
                errorEl.classList.add('show');
            }
        } catch(err) {
            errorEl.textContent = 'Network error. Please try again.';
            errorEl.classList.add('show');
        } finally {
            btn.disabled = false;
            document.getElementById('submitText').style.display = 'inline';
            document.getElementById('submitLoader').style.display = 'none';
        }
    });
    </script>
</body>
</html>
